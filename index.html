<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robin Kras</title>
    <meta name="description" content="Robin (R.P.M.) Kras — Data Engineer. A business card, and nothing more.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">

    <style>
        :root {
            --room-bg-1: #1c1a17;
            --room-bg-2: #0a0908;
            --card-bg: #efe8d6;
            --card-bg-2: #e6ddc7;
            --ink: #2a251d;
            --ink-soft: #56503f;
            --rule: rgba(42, 37, 29, 0.35);
            --wink: rgba(239, 232, 214, 0.38);
            --serif: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
            --sans-serif: 'EB Garamond', Georgia, serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--sans-serif);
            background: radial-gradient(ellipse at 50% 35%, var(--room-bg-1) 0%, var(--room-bg-2) 75%);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.25rem;
            -webkit-font-smoothing: antialiased;
        }

        .room {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* THE CARD */
        .card {
            position: relative;
            width: 400px;
            max-width: 90vw;
            aspect-ratio: 16 / 9;
            background: linear-gradient(155deg, var(--card-bg) 0%, var(--card-bg-2) 100%);
            border-radius: 3px;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.5) inset,
                0 40px 60px -20px rgba(0, 0, 0, 0.65),
                0 10px 20px -8px rgba(0, 0, 0, 0.5);
            padding: 2.1rem 2.3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.55rem;
            outline: none;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid var(--rule);
            pointer-events: none;
        }

        .card:hover,
        .card:focus-visible {
            transform: translateY(-6px) scale(1.015);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.5) inset,
                0 55px 80px -20px rgba(0, 0, 0, 0.7),
                0 14px 26px -8px rgba(0, 0, 0, 0.55);
        }

        .eyebrow {
            font-family: var(--serif);
            font-style: italic;
            font-size: 0.82rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .name {
            font-family: var(--serif);
            font-weight: 500;
            font-size: 1.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ink);
            line-height: 1.15;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .company {
            font-family: var(--serif);
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
        }

        .rule {
            height: 1px;
            width: 100%;
            background: var(--rule);
            margin: 0.35rem 0;
        }

        .contact-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.55rem;
            font-size: 0.72rem;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        .contact-row a {
            color: var(--ink-soft);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .contact-row a:hover {
            color: var(--ink);
            border-color: var(--ink-soft);
        }

        .contact-row .dot {
            color: var(--rule);
            font-size: 0.7rem;
        }

        .location {
            position: absolute;
            bottom: 1.6rem;
            right: 2.3rem;
            font-family: var(--serif);
            font-style: italic;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            color: var(--ink-soft);
        }

        /* CV LINK */
        .cv-link {
            margin-top: 1.75rem;
            font-family: var(--serif);
            font-style: italic;
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            color: var(--wink);
            text-decoration: none;
            border-bottom: 1px solid rgba(239, 232, 214, 0.22);
            padding-bottom: 0.15rem;
            transition: color 0.3s, border-color 0.3s;
        }

        .cv-link:hover {
            color: #efe8d6;
            border-color: rgba(239, 232, 214, 0.6);
        }

        /* THE WINK */
        .wink {
            margin-top: 1.1rem;
            font-family: var(--serif);
            font-style: italic;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
            color: var(--wink);
            opacity: 0;
            transition: opacity 0.6s ease;
            text-align: center;
            max-width: 320px;
        }

        .card:hover ~ .wink,
        .card:focus-visible ~ .wink {
            opacity: 1;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.6rem 1.7rem;
            }

            .name {
                font-size: 1.5rem;
            }

            .location {
                position: static;
                margin-top: 0.4rem;
            }
        }
    </style>
</head>
<body>

    <main class="room">
        <div class="card" tabindex="0" aria-label="Robin Kras. Data Engineer, Rabobank. Business card.">
            <p class="eyebrow">Data Engineer</p>
            <h1 class="name">Robin&nbsp;R&nbsp;P.&nbsp;M.&nbsp;Kras</h1>
            <p class="company">Rabobank</p>

            <div class="rule"></div>

            <nav class="contact-row" aria-label="Contact links">
                <a href="mailto:robkraseu@gmail.com">Email</a>
                <span class="dot">·</span>
                <a href="https://www.linkedin.com/in/robkras" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <span class="dot">·</span>
                <a href="https://github.com/rbkrs" target="_blank" rel="noopener noreferrer">GitHub</a>
                <span class="dot">·</span>
                <a href="https://www.kaggle.com/robkraseu" target="_blank" rel="noopener noreferrer">Kaggle</a>
            </nav>

            <span class="location">Leiden, Netherlands</span>
        </div>

        <a href="Robin_Kras_CV.pdf" download class="cv-link">Curriculum&nbsp;Vitæ</a>

        <p class="wink" aria-hidden="true">Eggshell. Raised lettering. The watermark, tastefully omitted.</p>
    </main>

    <script>
        console.log(
            '%cSubtle. Tasteful.%c\nAlmost too pale to notice.',
            'font-family: Georgia, serif; font-style: italic; font-size: 13px; color: #cfc6ab;',
            'font-family: Georgia, serif; font-style: italic; font-size: 13px; color: #8a8367;'
        );
    </script>
</body>
</html>
